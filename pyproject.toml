[project]
name = "ttcg"
version = "0.1.0"
description = "Hybrid MC-NFSP for the Judgement (Oh Hell) card game — structured research codebase"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    # rlcard's import calls `pip freeze`, so pip must be present in the env.
    "pip>=24.0.0",
    "rlcard>=1.2.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "torch>=2.10.0",
]

[project.scripts]
ttcg = "ttcg.pipeline.cli:main"
ttcg-analyze = "ttcg.analysis.report:main"
ttcg-dashboard = "ttcg.dashboards.app:main"
ttcg-trends = "ttcg.dashboards.trends:main"

# Development / test tooling.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# Optional extra for the live monitoring dashboards (kept out of the core
# dependency set so plain training/eval installs stay lean).
dashboards = [
    "dash>=2.0.0",
    "plotly>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttcg"]

[tool.pytest.ini_options]
testpaths = ["tests"]